<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Schede Allenamento</title>
    <style>
        /* ==========================================================
           === CONTROLLO COLORI (VARIABILI CSS) ===
        ========================================================== */
        :root {
            /* 1. Sfondi */
            --bg-pagina: #0f172a;        
            --bg-card: #1e293b;          
            --bg-input: #0f172a;         
            --bg-giorno-box: #1a2332;    
            --bg-esercizio-box: #0f172a; 

            /* 2. Testi e Bordi */
            --color-titoli: #fcfcfc;     
            --color-testo: #fcfcfc;      
            --color-etichette: #fcfcfc;  
            --color-bordi: #133d77;      

            /* 3. Pulsanti */
            --btn-add-ex: #38bdf8;       
            --btn-add-giorno: #5855f7;   
            --btn-submit: #22c55e;       
            --btn-back: #ef4444;         
            --btn-share: #0284c7;        
            --btn-delete-ex: #ef4444;    

            /* 4. Scheda Finale */
            --header-giorno-1: #0284c7;  
            --header-giorno-2: #0369a1;  
            --card-ex-finale: #0f172a;   
            --bordo-ex-finale: #38bdf8;  
            --tag-muscolo-bg: #1e293b;   
            --tag-muscolo-text: #38bdf8; 
        }

        /* ==========================================================
           === CONTROLLO DIMENSIONI TESTI ===
        ========================================================== */
        h1 { font-size: 2.2rem; color: var(--color-titoli); text-align: center; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; text-align: center; }
        h3 { font-size: 1.2rem; }

        label[for="nome-cliente-iniziale"] { font-size: 1.8rem; color: var(--color-titoli); }
        #nome-cliente-iniziale { font-size: 1.5rem; padding: 14px; font-weight: bold; }

        label[for="giorno"] { font-size: 2rem; color: var(--color-titoli); }
        .giorno-select { font-size: 1.5rem; padding: 14px; font-weight: bold; }

        label[for="muscoli-generali"] { font-size: 2rem; }
        .muscoli-input { font-size: 1.5rem; }

        .esercizio-box label { font-size: 1.5rem; }
        .ex-nome { font-size: 1.1rem; font-weight: bold; }
        .ex-muscolo { font-size: 1rem; }
        .ex-serie { font-size: 1rem; }
        .ex-recupero { font-size: 1rem; }

        button { font-size: 1.1rem; }

        .ex-title { font-size: 1.3rem; }        
        .ex-muscolo-tag { font-size: 0.9rem; } 
        .ex-details { font-size: 1.05rem; }     

        /* ==========================================================
           === LAYOUT GENERALE ===
        ========================================================== */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-pagina); 
            color: var(--color-testo); 
            margin: 0; 
            padding: 20px; 
        }

        .card { 
            background-color: var(--bg-card); 
            padding: 25px; 
            border-radius: 12px; 
            max-width: 650px; 
            margin: 0 auto; 
            border: 1px solid var(--color-bordi); 
        }
        
        label { display: block; margin-top: 18px; color: var(--color-etichette); font-weight: bold; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border-radius: 6px; 
            border: 1px solid var(--color-bordi); 
            background-color: var(--bg-input); 
            color: var(--color-testo); 
            box-sizing: border-box;
        }

        .giorno-box {
            background-color: var(--bg-giorno-box);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--color-titoli);
        }

        .esercizio-box { background-color: var(--bg-esercizio-box); padding: 18px; border-radius: 8px; margin-top: 18px; border: 1px solid var(--color-bordi); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        button { width: 100%; padding: 14px; margin-top: 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background-color: var(--btn-add-ex); color: #0f172a; }
        .btn-add-giorno { background-color: var(--btn-add-giorno); color: #ffffff; margin-top: 25px; }
        .btn-submit { background-color: var(--btn-submit); color: #ffffff; }
        .btn-share { background-color: var(--btn-share); color: #ffffff; }
        .btn-back { background-color: var(--btn-back); color: #ffffff; margin-top: 10px; }
        
        .btn-remove-ex {
            background-color: var(--btn-delete-ex);
            color: #ffffff;
            padding: 8px 14px;
            font-size: 0.9rem;
            margin-top: 12px;
            width: auto;
            float: right;
        }

        /* === TASTO E PANNELLO MENU LATERALE === */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: var(--bg-card);
            color: var(--color-titoli);
            border: 1px solid var(--color-bordi);
            font-size: 1.5rem;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            width: auto;
            margin: 0;
        }

        #side-drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background-color: var(--bg-card);
            border-right: 2px solid var(--color-bordi);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #side-drawer.open {
            left: 0;
        }

        .atleta-item {
            background-color: var(--bg-giorno-box);
            border: 1px solid var(--color-bordi);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .atleta-item span {
            font-weight: bold;
            cursor: pointer;
            color: var(--btn-add-ex);
        }

        .atleta-actions button {
            width: auto;
            padding: 6px 10px;
            margin: 0;
            font-size: 0.8rem;
        }

        /* === GESTIONE VISIBILITÀ SCHERMATE === */
        #schermata-menu { display: none; }
        #form-creazione { display: none; }
        #scheda-finale { display: none; }

        /* === CARD SCELTA MENU === */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .menu-box {
            background-color: var(--bg-giorno-box);
            border: 2px solid var(--color-bordi);
            border-radius: 10px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .menu-box:hover {
            transform: translateY(-4px);
            border-color: var(--btn-add-ex);
        }

        .menu-box h3 { margin: 0; font-size: 1.3rem; color: var(--color-titoli); }
        .menu-box.disabled { opacity: 0.5; cursor: not-allowed; }
        .menu-box.disabled:hover { transform: none; border-color: var(--color-bordi); }

        details {
            background-color: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--color-bordi);
            overflow: hidden;
        }

        summary {
            background: linear-gradient(135deg, var(--header-giorno-1), var(--header-giorno-2));
            padding: 15px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: "▼";
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            transform: rotate(180deg);
        }

        .dettagli-giorno-content {
            padding: 15px;
        }

        .ex-card-final { background-color: var(--card-ex-finale); padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid var(--bordo-ex-finale); }
        .ex-title { font-weight: bold; margin: 0; color: var(--color-testo); }
        .ex-muscolo-tag { display: inline-block; background-color: var(--tag-muscolo-bg); color: var(--tag-muscolo-text); padding: 4px 10px; border-radius: 4px; margin-top: 6px; font-weight: bold; }
        .ex-details { display: flex; justify-content: space-between; margin-top: 10px; color: var(--color-etichette); }
    </style>
</head>
<body>

    <!-- PULSANTE MENU TRE RIGHE -->
    <button id="menu-btn" onclick="toggleDrawer()">☰</button>

    <!-- DRAWER LATERALE STORICO ATLETI -->
    <div id="side-drawer">
        <h2 style="margin-top: 40px;">Storico Atleti</h2>
        <p style="font-size: 0.9rem; color: var(--color-etichette);">Clicca su un atleta per caricare e modificare la sua scheda:</p>
        <div id="lista-storico-atleti"></div>
    </div>

    <h1 id="titolo-principale">Gestionale Fit</h1>

    <!-- SCHERMATA 1: NOMINATIVO ATLETA -->
    <div class="card" id="schermata-inizio">
        <h2>Benvenuto</h2>
        <label for="nome-cliente-iniziale">Nome Cliente / Atleta:</label>
        <input type="text" id="nome-cliente-iniziale" placeholder="es. Mario Rossi">
        <button class="btn-submit" onclick="vaiAlMenu()">Avanti →</button>
    </div>

    <!-- SCHERMATA 2: MENU DI SCELTA -->
    <div class="card" id="schermata-menu">
        <h2 id="sottotitolo-menu">Seleziona Scheda</h2>
        <div class="menu-grid">
            <div class="menu-box" onclick="apriSchedaAllenamento()">
                <h3>Scheda Allenamento</h3>
            </div>
            <div class="menu-box disabled" onclick="alert('La sezione Alimentazione sarà disponibile a breve!')">
                <h3>Scheda Alimentazione</h3>
                <span style="font-size: 0.8rem; color: var(--color-etichette);">(In arrivo)</span>
            </div>
        </div>
        <button class="btn-back" onclick="tornaAllaHome()">← Cambia Atleta</button>
    </div>

    <!-- SCHERMATA 3: FORM CREAZIONE SCHEDA ALLENAMENTO -->
    <div class="card" id="form-creazione">
        <h2>Crea Scheda Allenamento</h2>
        
        <div id="contenitore-giorni">
            <div class="giorno-box">
                <label for="giorno">Giorno / Sessione:</label>
                <select class="giorno-select">
                    <option value="Giorno 1">Giorno 1</option>
                    <option value="Giorno 2">Giorno 2</option>
                    <option value="Giorno 3">Giorno 3</option>
                    <option value="Giorno 4">Giorno 4</option>
                    <option value="Giorno 5">Giorno 5</option>
                    <option value="Richiamo / Extra">Richiamo / Extra</option>
                </select>

                <label for="muscoli-generali">Muscoli Coinvolti:</label>
                <input type="text" class="muscoli-input" placeholder="es. Spalle e Schiena">

                <h3 style="margin-top: 20px;">Esercizi</h3>
                <div class="lista-esercizi-giorno">
                    <div class="esercizio-box">
                        <label>Nome Esercizio:</label>
                        <input type="text" class="ex-nome" placeholder="es. Lat Machine">

                        <div class="grid-2">
                            <div>
                                <label>Muscolo (opzionale):</label>
                                <input type="text" class="ex-muscolo" placeholder="es. Schiena">
                            </div>
                            <div>
                                <label>Serie x Reps:</label>
                                <input type="text" class="ex-serie" placeholder="es. 4x10">
                            </div>
                        </div>

                        <label>Tempo di Recupero:</label>
                        <input type="text" class="ex-recupero" placeholder="es. 90 secondi">

                        <button type="button" class="btn-remove-ex" onclick="rimuoviEsercizio(this)">🗑️ Rimuovi Esercizio</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <button class="btn-add" onclick="aggiungiEsercizio(this)">+ Aggiungi un altro esercizio</button>
            </div>
        </div>

        <button class="btn-add-giorno" onclick="aggiungiGiorno()">+ AGGIUNGI UN ALTRO GIORNO</button>
        <button class="btn-submit" onclick="generaSchedaFinale()">Genera Scheda Finale</button>
        <button class="btn-back" onclick="tornaAlMenu()">← Torna al Menu</button>
    </div>

    <!-- SCHERMATA 4: VISTA SCHEDA FINALE -->
    <div class="card" id="scheda-finale">
        <div id="res-lista-giorni"></div>

        <button class="btn-share" id="btn-condividi" onclick="copiaLinkCliente()">🔗 Copia Link da inviare al Cliente</button>
        <button class="btn-back" id="btn-modifica" onclick="tornaAlForm()">← Torna a Modificare</button>
    </div>

    <script>
        let datiSchedaAttuale = null;
        let nomeAtletaSalvato = "";

        // GESTIONE DRAWER MENU
        function toggleDrawer() {
            document.getElementById('side-drawer').classList.toggle('open');
            aggiornaListaStorico();
        }

        // NAVIGAZIONE TRA LE SCHERMATE
        function vaiAlMenu() {
            const inputNome = document.getElementById('nome-cliente-iniziale').value;
            if (inputNome.trim() === "") {
                alert("Per favore inserisci il nome del cliente!");
                return;
            }
            nomeAtletaSalvato = inputNome;
            document.getElementById('titolo-principale').innerText = "Atleta: " + nomeAtletaSalvato;
            
            document.getElementById('schermata-inizio').style.display = 'none';
            document.getElementById('schermata-menu').style.display = 'block';
        }

        function tornaAllaHome() {
            document.getElementById('titolo-principale').innerText = "Gestionale Fit";
            document.getElementById('schermata-menu').style.display = 'none';
            document.getElementById('schermata-inizio').style.display = 'block';
        }

        function apriSchedaAllenamento() {
            document.getElementById('schermata-menu').style.display = 'none';
            document.getElementById('form-creazione').style.display = 'block';
        }

        function tornaAlMenu() {
            document.getElementById('form-creazione').style.display = 'none';
            document.getElementById('schermata-menu').style.display = 'block';
        }

        // GESTIONE ESERCIZI E GIORNI
        function rimuoviEsercizio(btn) {
            const esercizioBox = btn.closest('.esercizio-box');
            const container = esercizioBox.parentElement;
            
            if (container.querySelectorAll('.esercizio-box').length > 1) {
                esercizioBox.remove();
            } else {
                alert("Devi mantenere almeno un esercizio per questo giorno!");
            }
        }

        function aggiungiEsercizio(btn) {
            const giornoBox = btn.closest('.giorno-box');
            const container = giornoBox.querySelector('.lista-esercizi-giorno');
            
            const nuovoEsercizio = document.createElement('div');
            nuovoEsercizio.className = 'esercizio-box';
            nuovoEsercizio.innerHTML = `
                <label>Nome Esercizio:</label>
                <input type="text" class="ex-nome" placeholder="es. Alzate Laterali">

                <div class="grid-2">
                    <div>
                        <label>Muscolo (opzionale):</label>
                        <input type="text" class="ex-muscolo" placeholder="es. Spalle">
                    </div>
                    <div>
                        <label>Serie x Reps:</label>
                        <input type="text" class="ex-serie" placeholder="es. 3x12">
                    </div>
                </div>

                <label>Tempo di Recupero:</label>
                <input type="text" class="ex-recupero" placeholder="es. 60 secondi">

                <button type="button" class="btn-remove-ex" onclick="rimuoviEsercizio(this)">🗑️ Rimuovi Esercizio</button>
                <div style="clear: both;"></div>
            `;
            container.appendChild(nuovoEsercizio);
        }

        function aggiungiGiorno() {
            const contenitore = document.getElementById('contenitore-giorni');
            const numeroGiorni = contenitore.querySelectorAll('.giorno-box').length + 1;
            
            const nuovoGiorno = document.createElement('div');
            nuovoGiorno.className = 'giorno-box';
            nuovoGiorno.innerHTML = `
                <label>Giorno / Sessione:</label>
                <select class="giorno-select">
                    <option value="Giorno ${numeroGiorni}">Giorno ${numeroGiorni}</option>
                    <option value="Giorno 1">Giorno 1</option>
                    <option value="Giorno 2">Giorno 2</option>
                    <option value="Giorno 3">Giorno 3</option>
                    <option value="Giorno 4">Giorno 4</option>
                    <option value="Giorno 5">Giorno 5</option>
                    <option value="Richiamo / Extra">Richiamo / Extra</option>
                </select>

                <label>Muscoli Coinvolti:</label>
                <input type="text" class="muscoli-input" placeholder="es. Petto e Bicipiti">

                <h3 style="margin-top: 20px;">Esercizi</h3>
                <div class="lista-esercizi-giorno">
                    <div class="esercizio-box">
                        <label>Nome Esercizio:</label>
                        <input type="text" class="ex-nome" placeholder="es. Panca Piana">

                        <div class="grid-2">
                            <div>
                                <label>Muscolo (opzionale):</label>
                                <input type="text" class="ex-muscolo" placeholder="es. Petto">
                            </div>
                            <div>
                                <label>Serie x Reps:</label>
                                <input type="text" class="ex-serie" placeholder="es. 4x8">
                            </div>
                        </div>

                        <label>Tempo di Recupero:</label>
                        <input type="text" class="ex-recupero" placeholder="es. 2 minuti">

                        <button type="button" class="btn-remove-ex" onclick="rimuoviEsercizio(this)">🗑️ Rimuovi Esercizio</button>
                        <div style="clear: both;"></div>
                    </div>
                </div>

                <button class="btn-add" onclick="aggiungiEsercizio(this)">+ Aggiungi un altro esercizio</button>
            `;
            contenitore.appendChild(nuovoGiorno);
        }

        function generaSchedaFinale() {
            const blocchiGiorno = document.querySelectorAll('.giorno-box');
            
            datiSchedaAttuale = {
                cliente: nomeAtletaSalvato,
                giorni: []
            };

            blocchiGiorno.forEach((giornoBox) => {
                const giornoNome = giornoBox.querySelector('.giorno-select').value;
                const muscoli = giornoBox.querySelector('.muscoli-input').value || "Generali";

                const nomi = giornoBox.querySelectorAll('.ex-nome');
                const muscoliEx = giornoBox.querySelectorAll('.ex-muscolo');
                const serie = giornoBox.querySelectorAll('.ex-serie');
                const recuperi = giornoBox.querySelectorAll('.ex-recupero');

                let esercizi = [];
                for (let i = 0; i < nomi.length; i++) {
                    esercizi.push({
                        nome: nomi[i].value || `Esercizio ${i+1}`,
                        muscolo: muscoliEx[i].value,
                        serie: serie[i].value || "3x10",
                        recupero: recuperi[i].value || "60 sec"
                    });
                }

                datiSchedaAttuale.giorni.push({
                    nome: giornoNome,
                    muscoli: muscoli,
                    esercizi: esercizi
                });
            });

            // SALVATAGGIO AUTOMATICO NEL LOCAL STORAGE
            salvaInStorico(datiSchedaAttuale);

            renderizzaScheda(datiSchedaAttuale);
            document.getElementById('form-creazione').style.display = 'none';
            document.getElementById('scheda-finale').style.display = 'block';
        }

        function renderizzaScheda(data) {
            if (data.cliente && data.cliente.trim() !== "") {
                document.getElementById('titolo-principale').innerText = "Scheda " + data.cliente;
            } else {
                document.getElementById('titolo-principale').innerText = "Scheda Allenamento";
            }

            let htmlSchedaFinale = "";

            data.giorni.forEach((giorno) => {
                let htmlEsercizi = "";
                giorno.esercizi.forEach((ex, i) => {
                    htmlEsercizi += `
                        <div class="ex-card-final">
                            <p class="ex-title">${i+1}. ${ex.nome}</p>
                            ${ex.muscolo ? `<span class="ex-muscolo-tag">${ex.muscolo}</span>` : ''}
                            <div class="ex-details">
                                <span>Serie: <b>${ex.serie}</b></span>
                                <span>Recupero: <b>${ex.recupero}</b></span>
                            </div>
                        </div>
                    `;
                });

                htmlSchedaFinale += `
                    <details>
                        <summary>
                            <span>${giorno.nome}</span>
                            <span style="font-size: 0.9rem; font-weight: normal; opacity: 0.9;">${giorno.muscoli}</span>
                        </summary>
                        <div class="dettagli-giorno-content">
                            ${htmlEsercizi}
                        </div>
                    </details>
                `;
            });

            document.getElementById('res-lista-giorni').innerHTML = htmlSchedaFinale;
        }

        function copiaLinkCliente() {
            if (!datiSchedaAttuale) return;
            
            const jsonString = JSON.stringify(datiSchedaAttuale);
            const encodedData = encodeURIComponent(jsonString);
            
            const urlCliente = window.location.origin + window.location.pathname + "?data=" + encodedData;

            navigator.clipboard.writeText(urlCliente).then(() => {
                const btn = document.getElementById('btn-condividi');
                btn.innerText = "✅ Link Copiato! Invialo su WhatsApp";
                setTimeout(() => {
                    btn.innerText = "🔗 Copia Link da inviare al Cliente";
                }, 3000);
            });
        }

        function tornaAlForm() {
            document.getElementById('form-creazione').style.display = 'block';
            document.getElementById('scheda-finale').style.display = 'none';
        }

        // SALVATAGGIO E GESTIONE STORICO (LOCALSTORAGE)
        function salvaInStorico(scheda) {
            let storico = JSON.parse(localStorage.getItem('storicoAtleti')) || [];
            // Rimuovi eventuale scheda precedente con lo stesso nome per aggiornarla
            storico = storico.filter(item => item.cliente.toLowerCase() !== scheda.cliente.toLowerCase());
            storico.push(scheda);
            localStorage.setItem('storicoAtleti', JSON.stringify(storico));
        }

        function aggiornaListaStorico() {
            const container = document.getElementById('lista-storico-atleti');
            const storico = JSON.parse(localStorage.getItem('storicoAtleti')) || [];

            if (storico.length === 0) {
                container.innerHTML = "<p style='color: var(--color-etichette);'>Nessun atleta salvato.</p>";
                return;
            }

            let html = "";
            storico.forEach((item, index) => {
                html += `
                    <div class="atleta-item">
                        <span onclick="caricaAtletaDaStorico(${index})">${item.cliente}</span>
                        <div class="atleta-actions">
                            <button class="btn-back" onclick="eliminaDaStorico(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function caricaAtletaDaStorico(index) {
            const storico = JSON.parse(localStorage.getItem('storicoAtleti')) || [];
            const schedaSelezionata = storico[index];
            if (!schedaSelezionata) return;

            datiSchedaAttuale = schedaSelezionata;
            nomeAtletaSalvato = schedaSelezionata.cliente;

            // Nascondi le schermate iniziali e mostra direttamente la scheda finale generata
            document.getElementById('schermata-inizio').style.display = 'none';
            document.getElementById('schermata-menu').style.display = 'none';
            document.getElementById('form-creazione').style.display = 'none';

            renderizzaScheda(schedaSelezionata);
            document.getElementById('scheda-finale').style.display = 'block';
            
            toggleDrawer(); // Chiudi il menu
        }

        function eliminaDaStorico(index) {
            let storico = JSON.parse(localStorage.getItem('storicoAtleti')) || [];
            storico.splice(index, 1);
            localStorage.setItem('storicoAtleti', JSON.stringify(storico));
            aggiornaListaStorico();
        }

        // APERTURA LINK CLIENTE
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            if (dataParam) {
                try {
                    const data = JSON.parse(decodeURIComponent(dataParam));
                    // Nascondi anche il tasto del menu se è il cliente ad aprire il link
                    document.getElementById('menu-btn').style.display = 'none';
                    document.getElementById('schermata-inizio').style.display = 'none';
                    document.getElementById('schermata-menu').style.display = 'none';
                    document.getElementById('form-creazione').style.display = 'none';
                    document.getElementById('btn-condividi').style.display = 'none';
                    document.getElementById('btn-modifica').style.display = 'none';
                    
                    renderizzaScheda(data);
                    document.getElementById('scheda-finale').style.display = 'block';
                } catch (e) {
                    console.error("Errore nel caricamento dei dati", e);
                }
            }
        };
    </script>
</body>
</html>
